# Config train chung cho YOLO11-seg va YOLO26-seg (xem CLAUDE.md muc 16 buoc 2)
#
# Nguyen tac: HAI model dung CHUNG khoi `common` de so sanh cong bang
# (cung dataset/split/imgsz/epochs/augmentation/seed). Chi khac `weights`.
# Baseline: ca hai dung size n (yolo11n-seg / yolo26n-seg).
# Khong hardcode gia tri nay trong code - moi script doc tu day.

# Dataset yaml theo dinh dang Ultralytics.
# Split phai chia theo video/sequence, KHONG chia ngau nhien theo frame
# (xem CLAUDE.md muc 7). Xem data/dataset.example.yaml lam mau.
data: data/dataset.yaml

common:
  epochs: 100
  imgsz: 960          # baseline 2026-11-13: VisDrone vat the nho, 640 qua thap
  batch: 8
  workers: 4
  device: 0            # index GPU tren cloud PC; "cpu" khi smoke test local
  seed: 0              # ghi lai seed - bat buoc o vong benchmark cuoi (muc 14)
  patience: 30
  optimizer: auto
  cos_lr: false
  pretrained: true
  val: true
  plots: true

  # Augmentation - giu giong nhau giua 2 model de so sanh cong bang
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0

# Tham so inference/danh gia dung CHUNG cho ca hai model (detect/track/
# run_pipeline va src/evaluate.py doc tu day). KHONG dat trong `common` vi
# `common` duoc truyen thang vao model.train().
# conf: nguong confidence detection truoc tracker.
# 2026-11-13: chot 0.1 (truoc la 0.25) = bang track_low_thresh trong
# configs/botsort.yaml, de vong match thu hai cua BoT-SORT nhan duoc detection
# diem thap (0.1..0.25); cung la gia tri ultralytics model.track() tu dung khi
# khong truyen conf. Tao track moi van can >= new_track_thresh (0.25), vong
# match dau van can >= track_high_thresh (0.25).
# Luu y: src/detect.py (chi detect, khong track) cung dung conf nay -> log
# detect se co ca box diem thap 0.1..0.25.
inference:
  conf: 0.1

# Thu muc chua weights pretrained da tai san (gitignore). Train dung
# <weights_dir>/<weights> neu co; khong co thi Ultralytics tu tai theo ten.
weights_dir: weights

models:
  yolo11_seg:
    weights: yolo11n-seg.pt
    run_name: yolo11_seg

  yolo26_seg:
    # Da xac minh tai duoc tren ultralytics 8.4.174 (8.3.0 KHONG co).
    # Neu ten khong khop sau khi doi version -> dung lai va bao, KHONG tu doi
    # sang YOLO11 (xem CLAUDE.md muc 9).
    weights: yolo26n-seg.pt
    run_name: yolo26_seg

# Thu muc goc luu ket qua train. Moi lan chay tao 1 thu muc con theo
# experiment id (xem CLAUDE.md muc 14).
output_root: experiments
