# Config cua experiment nay. Dien truoc khi chay, khong sua sau khi da co
# ket qua (CLAUDE.md muc 13).

experiment_id: ""
date: ""
purpose: ""          # cau hoi experiment nay tra loi

detector:
  model: ""          # yolo11_seg | yolo26_seg
  weights: ""
  # null = lay theo run_context.json cua lan train sinh ra weights, roi
  # configs/train_config.yaml. Dien so neu muon co dinh; --imgsz tren CLI
  # van uu tien cao nhat (src/utils/inference_settings.py).
  imgsz: null
  # conf co dinh o inference.conf trong configs/train_config.yaml (dung chung
  # cho ca hai model); --conf chi de thu nghiem, nguon ghi vao meta.
  conf: null

tracker:
  type: botsort
  config: configs/botsort.yaml
  with_reid: false   # ghi ro true/false da dung

motion_memory:
  enabled: false
  lost_timeout_frames: 15
  reid_timeout_frames: 45

dataset:
  name: ""
  split: ""          # ten split co dinh da dung
